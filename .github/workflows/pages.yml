name: Build and deploy HJNotes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test article generator
        run: python -m unittest discover -s tests
      - name: Validate articles and prepare PDF pages
        run: python scripts/build_content.py
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.169.0'
      - uses: actions/configure-pages@v5
      - name: Build site
        run: hugo --minify
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

